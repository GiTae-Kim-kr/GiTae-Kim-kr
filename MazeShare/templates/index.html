<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MazeShare</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 오른쪽 하단 고정 미로 생성 버튼 */
        .fab-create-maze {
            position: fixed;
            right: 40px;
            bottom: 40px;
            z-index: 999;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <!-- 네비게이션 바 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">MazeShare</a>
        <div class="d-flex ms-auto">
          <a class="nav-link text-white" href="#">로그인</a>
          <a class="nav-link text-white ms-3" href="#">로그아웃</a>
        </div>
      </div>
    </nav>

    <!-- 메인 컨텐츠 영역 -->
    <div class="container mt-5">
        <!-- 상단 제목 -->
        <h1 class="mb-4">MazeShare에 오신 것을 환영합니다!</h1>

        <!-- 검색 & 정렬/필터 영역 -->
        <div class="row mb-4">
            <div class="col-md-6">
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="미로 검색" aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">검색</button>
                </form>
            </div>
            <div class="col-md-3">
                <!-- 정렬/필터 드롭다운 -->
                <div class="dropdown">
                  <button class="btn btn-secondary dropdown-toggle w-100" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    정렬/필터 선택
                  </button>
                  <ul class="dropdown-menu w-100">
                    <li><a class="dropdown-item" href="#">랭킹</a></li>
                    <li><a class="dropdown-item" href="#">즐겨찾기</a></li>
                    <li><a class="dropdown-item" href="#">My</a></li>
                  </ul>
                </div>
            </div>
        </div>

        <!-- 미로 카드 리스트 (예시 6개로 2줄 보이게) -->
        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">미로 제목 1</h5>
                        <p class="card-text">미로 설명 또는 간단 정보</p>
                        <a href="#" class="btn btn-primary">플레이</a>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">미로 제목 2</h5>
                        <p class="card-text">미로 설명 또는 간단 정보</p>
                        <a href="#" class="btn btn-primary">플레이</a>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">미로 제목 3</h5>
                        <p class="card-text">미로 설명 또는 간단 정보</p>
                        <a href="#" class="btn btn-primary">플레이</a>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">미로 제목 4</h5>
                        <p class="card-text">미로 설명 또는 간단 정보</p>
                        <a href="#" class="btn btn-primary">플레이</a>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">미로 제목 5</h5>
                        <p class="card-text">미로 설명 또는 간단 정보</p>
                        <a href="#" class="btn btn-primary">플레이</a>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">미로 제목 6</h5>
                        <p class="card-text">미로 설명 또는 간단 정보</p>
                        <a href="#" class="btn btn-primary">플레이</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- 페이지네이션 (아래쪽에 충분한 여백) -->
        <nav aria-label="미로 페이지네이션" class="mt-5 mb-5">
          <ul class="pagination justify-content-center">
            <li class="page-item disabled">
              <a class="page-link" href="#" tabindex="-1">이전</a>
            </li>
            <li class="page-item active"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">3</a></li>
            <li class="page-item">
              <a class="page-link" href="#">다음</a>
            </li>
          </ul>
        </nav>
    </div>

    <!-- 오른쪽 하단 미로 생성 플로팅 버튼 -->
    <a href="/create_maze" class="btn btn-warning fab-create-maze" title="미로 생성">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-plus-lg" viewBox="0 0 16 16">
          <path d="M8 1.5a.5.5 0 0 1 .5.5v5.5H14a.5.5 0 0 1 0 1H8.5V14a.5.5 0 0 1-1 0V8.5H2a.5.5 0 0 1 0-1h5.5V2a.5.5 0 0 1 .5-.5z"/>
        </svg>
    </a>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

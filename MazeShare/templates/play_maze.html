<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{{ maze.title }} - 플레이</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        #maze-canvas {
            border: 2px solid #333;
            margin: 20px auto;
            display: block;
            background-color: white;
        }
        .ranking-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .player {
            transition: all 0.1s ease;
        }
        #reviewButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        /* 별점 입력 스타일 (왼쪽부터 오른쪽으로 채워짐) */
        .star-rating {
            font-size: 24px;
            margin-bottom: 15px;
            display: flex;
        }
        .star-rating .star {
            cursor: pointer;
            color: #ddd;
            margin: 0 2px;
        }
        .star-rating .star:hover,
        .star-rating .star.active {
            color: #ffd700;
        }
        .star-rating input {
            display: none;
        }
        .review-card { margin-bottom: 15px; }
        /* 리뷰 카드의 별점 표시 (작게, 점수 표시 없음) */
        .review-rating { color: #ffd700; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>{{ maze.title }} <small class="text-muted">by {{ maze.author.username }}</small></h2>
            <div>
                <button id="playButton" class="btn btn-primary">플레이 시작</button>
                <button class="btn btn-outline-info ms-2" data-bs-toggle="modal" data-bs-target="#rankingModal">
                    랭킹 보기
                </button>
                <button class="btn btn-outline-warning ms-2" id="reviewButton" disabled>
                    리뷰 등록/보기
                </button>
                <div id="timerDisplay" class="text-muted mt-2" style="display: none;">
                    <span class="badge bg-danger">시간: <span id="timeValue">0.00</span>초</span>
                </div>
            </div>
        </div>

        <canvas id="maze-canvas" width="600" height="600"></canvas>

        <div class="text-center mt-4">
            <a href="/" class="btn btn-secondary">메인으로</a>
        </div>
    </div>

    <!-- 랭킹 모달 -->
    <div class="modal fade" id="rankingModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">🏆 {{ maze.title }} 랭킹</h5>
                    <button type="button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <ul id="rankingList" class="list-group ranking-list"></ul>
                </div>
            </div>
        </div>
    </div>

    <!-- 리뷰 모달 -->
    <div class="modal fade" id="reviewModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">📝 {{ maze.title }} 리뷰</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="reviewsList" class="mb-4"></div>
                    <form id="reviewForm">
                        <div class="star-rating">
                            <input type="radio" id="star1" name="rating" value="1">
                            <label for="star1" class="star"><i class="fas fa-star"></i></label>
                            <input type="radio" id="star2" name="rating" value="2">
                            <label for="star2" class="star"><i class="fas fa-star"></i></label>
                            <input type="radio" id="star3" name="rating" value="3">
                            <label for="star3" class="star"><i class="fas fa-star"></i></label>
                            <input type="radio" id="star4" name="rating" value="4">
                            <label for="star4" class="star"><i class="fas fa-star"></i></label>
                            <input type="radio" id="star5" name="rating" value="5">
                            <label for="star5" class="star"><i class="fas fa-star"></i></label>
                        </div>
                        <textarea class="form-control mb-3"
                                  name="review"
                                  placeholder="리뷰를 작성해주세요 (최대 200자)"
                                  rows="3"
                                  maxlength="200"
                                  required></textarea>
                        <button type="submit" class="btn btn-success w-100">등록</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
document.addEventListener('DOMContentLoaded', function() {
    const mazeData = {{ maze_data | tojson }};
    const startPos = {{ start_pos | tojson }};
    const endPos = {{ end_pos | tojson }};
    const mazeId = {{ maze.id }};

    const canvas = document.getElementById('maze-canvas');
    const ctx = canvas.getContext('2d');
    const reviewButton = document.getElementById('reviewButton');

    // 랭킹 등록 여부 확인
    fetch(`/check_ranking/${mazeId}`)
        .then(res => res.json())
        .then(data => {
            reviewButton.disabled = !data.has_ranking;
        });

    if (!Array.isArray(mazeData) || mazeData.length === 0) {
        console.error("Invalid maze data:", mazeData);
        return;
    }

    const cols = mazeData[0].length;
    const rows = mazeData.length;
    const cellSize = Math.min(canvas.width / cols, canvas.height / rows);

    let player = { x: startPos.x, y: startPos.y };
    let timerInterval, startTime, isPlaying = false;

    function drawMaze() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 벽 그리기
        ctx.fillStyle = "#000000";
        for(let y = 0; y < rows; y++) {
            for(let x = 0; x < cols; x++) {
                if(mazeData[y][x] === 1) {
                    ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
                }
            }
        }

        // 시작점 그리기
        ctx.fillStyle = "#00FF00";
        ctx.beginPath();
        ctx.arc(
            (startPos.x + 0.5) * cellSize,
            (startPos.y + 0.5) * cellSize,
            cellSize/4, 0, 2 * Math.PI
        );
        ctx.fill();

        // 도착점 그리기
        ctx.fillStyle = "#FF0000";
        ctx.beginPath();
        ctx.arc(
            (endPos.x + 0.5) * cellSize,
            (endPos.y + 0.5) * cellSize,
            cellSize/4, 0, 2 * Math.PI
        );
        ctx.fill();

        // 플레이어 그리기
        ctx.fillStyle = "#0000FF";
        ctx.beginPath();
        ctx.arc(
            (player.x + 0.5) * cellSize,
            (player.y + 0.5) * cellSize,
            cellSize/5, 0, 2 * Math.PI
        );
        ctx.fill();
    }

    document.getElementById('playButton').addEventListener('click', () => {
        isPlaying = true;
        player = { x: startPos.x, y: startPos.y };
        document.getElementById('playButton').disabled = true;
        document.getElementById('timerDisplay').style.display = 'block';
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 50);
        drawMaze();
    });

    function updateTimer() {
        const elapsed = Date.now() - startTime;
        document.getElementById('timeValue').textContent = (elapsed / 1000).toFixed(2);
    }

    document.addEventListener('keydown', (e) => {
        if (!isPlaying) return;

        const prev = { x: player.x, y: player.y };
        switch(e.key) {
            case 'ArrowUp': player.y--; break;
            case 'ArrowDown': player.y++; break;
            case 'ArrowLeft': player.x--; break;
            case 'ArrowRight': player.x++; break;
        }

        if (mazeData[player.y]?.[player.x] === 1) {
            player = prev;
        }

        drawMaze();

        // 도착 시 기록 업데이트
        if (player.x === endPos.x && player.y === endPos.y) {
            clearInterval(timerInterval);
            isPlaying = false;
            const time = (Date.now() - startTime) / 1000;

            fetch(`/submit_time/${mazeId}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ time: time })
            }).then(res => res.json())
            .then(data => {
                if(data.success) {
                    alert(`기록: ${time.toFixed(2)}초!`);
                    location.reload();
                }
            });
        }
    });

    // 랭킹 모달 (최고 기록만 표시)
    document.getElementById('rankingModal').addEventListener('show.bs.modal', () => {
        fetch(`/maze_reviews/${mazeId}/rankings`)
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('rankingList');
                list.innerHTML = data.map((r, i) => `
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <span class="badge bg-primary me-2">${i+1}위</span>
                            ${r.username}
                        </div>
                        <span class="badge bg-success">${r.best_time.toFixed(2)}초</span>
                    </li>
                `).join('') || '<li class="list-group-item">아직 기록이 없습니다</li>';
            });
    });

    // 리뷰 버튼 클릭 시 모달 표시
    document.getElementById('reviewButton').addEventListener('click', () => {
        const reviewModal = new bootstrap.Modal('#reviewModal');
        reviewModal.show();
        loadReviews();
    });

    function loadReviews() {
        fetch(`/maze_reviews/${mazeId}`)
            .then(res => res.json())
            .then(reviews => {
                const reviewsList = document.getElementById('reviewsList');
                reviewsList.innerHTML = reviews.map(r => {
                    // created_at이 문자열이면 그대로, 아니면 포맷팅
                    let createdAt = r.created_at;
                    if (typeof createdAt !== 'string') {
                        createdAt = new Date(createdAt).toISOString().split('T')[0];
                    }
                    // 별점 별 표시 (작게, 점수 없이)
                    return `
                        <div class="card mb-3 review-card">
                            <div class="card-body">
                                <h6 class="card-subtitle mb-2 text-muted">
                                    ${r.username} (${createdAt})
                                </h6>
                                <div class="review-rating">
                                    ${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}
                                </div>
                                <p class="card-text">${r.content}</p>
                            </div>
                        </div>
                    `;
                }).join('') || '<div class="text-center">아직 리뷰가 없습니다</div>';
            });
    }

    // 별점 선택 기능 (왼쪽부터 오른쪽으로 채우기)
    document.querySelectorAll('.star-rating .star').forEach((star, index, stars) => {
        star.addEventListener('click', function() {
            const rating = this.previousElementSibling.value;
            // 모든 별 초기화
            stars.forEach(s => s.classList.remove('active'));
            // 클릭한 별까지 채우기 (왼쪽부터 오른쪽으로)
            for (let i = 0; i <= index; i++) {
                stars[i].classList.add('active');
            }
        });
    });

    // 리뷰 제출 처리 (별점 필수)
    document.getElementById('reviewForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const rating = document.querySelector('input[name="rating"]:checked')?.value;
        if (!rating) {
            alert('별점을 선택해주세요!');
            return;
        }
        formData.append('rating', rating);

        fetch(`/submit_review/${mazeId}`, {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            alert(data.message);
            if(data.success) {
                e.target.reset();
                document.querySelectorAll('.star').forEach(s => s.classList.remove('active'));
                loadReviews();
            }
        });
    });

    drawMaze();
});
</script>
</body>
</html>

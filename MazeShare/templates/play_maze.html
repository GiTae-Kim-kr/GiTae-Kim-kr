<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{{ maze.title }} - 플레이</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #maze-canvas {
            border: 2px solid #333;
            margin: 20px auto;
            display: block;
            background-color: white;
        }
        .ranking-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .player {
            transition: all 0.1s ease;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>{{ maze.title }} <small class="text-muted">by {{ maze.author.username }}</small></h2>
            <div>
                <button id="playButton" class="btn btn-primary">플레이 시작</button>
                <button class="btn btn-outline-info ms-2" data-bs-toggle="modal" data-bs-target="#rankingModal">
                    랭킹 보기
                </button>
                <div id="timerDisplay" class="text-muted mt-2" style="display: none;">
                    <span class="badge bg-danger">시간: <span id="timeValue">0.00</span>초</span>
                </div>
            </div>
        </div>

        <canvas id="maze-canvas" width="600" height="600"></canvas>

        <div class="text-center mt-4">
            <a href="/" class="btn btn-secondary">메인으로</a>
        </div>
    </div>

    <div class="modal fade" id="rankingModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">🏆 {{ maze.title }} 랭킹</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <ul id="rankingList" class="list-group ranking-list">
                        <!-- 동적 로딩 -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
document.addEventListener('DOMContentLoaded', function() {
    const mazeData = {{ maze_data | tojson }};
    const startPos = {{ start_pos | tojson }};
    const endPos = {{ end_pos | tojson }};
    const mazeId = {{ maze.id }};

    const canvas = document.getElementById('maze-canvas');
    const ctx = canvas.getContext('2d');

    if (!Array.isArray(mazeData) || mazeData.length === 0) {
        console.error("Invalid maze data:", mazeData);
        return;
    }

    const cols = mazeData[0].length;
    const rows = mazeData.length;
    const cellSize = Math.min(canvas.width / cols, canvas.height / rows);

    let player = { x: startPos.x, y: startPos.y };
    let timerInterval, startTime, isPlaying = false;

    function drawMaze() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#000000";
        for(let y = 0; y < rows; y++) {
            for(let x = 0; x < cols; x++) {
                if(mazeData[y][x] === 1) {
                    ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
                }
            }
        }

        ctx.fillStyle = "#00FF00";
        ctx.beginPath();
        ctx.arc(
            (startPos.x + 0.5) * cellSize,
            (startPos.y + 0.5) * cellSize,
            cellSize/4, 0, 2 * Math.PI
        );
        ctx.fill();

        ctx.fillStyle = "#FF0000";
        ctx.beginPath();
        ctx.arc(
            (endPos.x + 0.5) * cellSize,
            (endPos.y + 0.5) * cellSize,
            cellSize/4, 0, 2 * Math.PI
        );
        ctx.fill();

        ctx.fillStyle = "#0000FF";
        ctx.beginPath();
        ctx.arc(
            (player.x + 0.5) * cellSize,
            (player.y + 0.5) * cellSize,
            cellSize/5, 0, 2 * Math.PI
        );
        ctx.fill();
    }

    document.getElementById('playButton').addEventListener('click', () => {
        isPlaying = true;
        player = { x: startPos.x, y: startPos.y };
        document.getElementById('playButton').disabled = true;
        document.getElementById('timerDisplay').style.display = 'block';
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 50);
        drawMaze();
    });

    function updateTimer() {
        const elapsed = Date.now() - startTime;
        document.getElementById('timeValue').textContent = (elapsed / 1000).toFixed(2);
    }

    document.addEventListener('keydown', (e) => {
        if (!isPlaying) return;

        const prev = { x: player.x, y: player.y };
        switch(e.key) {
            case 'ArrowUp': player.y--; break;
            case 'ArrowDown': player.y++; break;
            case 'ArrowLeft': player.x--; break;
            case 'ArrowRight': player.x++; break;
        }

        if (mazeData[player.y]?.[player.x] === 1) {
            player = prev;
        }

        drawMaze();

        if (player.x === endPos.x && player.y === endPos.y) {
            clearInterval(timerInterval);
            isPlaying = false;
            const time = (Date.now() - startTime) / 1000;
            fetch(`/submit_time/${mazeId}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ time: time })
            }).then(res => res.json())
            .then(data => {
                if(data.success) {
                    alert(`기록: ${time.toFixed(2)}초!`);
                    location.reload();
                } else {
                    alert('기록 저장 실패: ' + data.message);
                }
            });
        }
    });

    document.getElementById('rankingModal').addEventListener('show.bs.modal', () => {
        fetch(`/maze_reviews/${mazeId}/rankings`)
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('rankingList');
                list.innerHTML = data.map((r, i) => `
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <span class="badge bg-primary me-2">${i+1}위</span>
                            ${r.username}
                        </div>
                        <span class="badge bg-success">${r.time_seconds.toFixed(2)}초</span>
                    </li>
                `).join('') || '<li class="list-group-item">아직 기록이 없습니다</li>';
            });
    });

    drawMaze();
});
</script>
    

</body>
</html>
